<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; background: #f6f7f9; color: #0f172a;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { padding: 22px 24px; }
      .head { display: flex; align-items: center; gap: 14px; }
      .logo { width: 56px; height: 56px; }
      h1 { font-size: 18px; margin: 0; }
      .muted { color: #64748b; font-size: 12px; }
      table { margin-top: 16px; border-collapse: collapse; width: 100%; font-size: 12.5px; }
      td { padding: 5px 6px; border-bottom: 1px solid #e8edf2; }
      td.k { color: #64748b; width: 42%; }
      .foot { margin-top: 16px; font-size: 11px; color: #94a3b8; }
      code { font-family: ui-monospace, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="92" height="92" rx="22" fill="#0f766e"/>
          <rect x="47.5" y="30" width="5" height="44" rx="2.5" fill="#fff"/>
          <ellipse cx="50" cy="27" rx="8" ry="9" fill="#fff"/>
          <path d="M36 44 Q46 40 50 52 Q40 54 36 44 Z" fill="#d6f0ed"/>
          <path d="M64 40 Q54 38 50 50 Q60 53 64 40 Z" fill="#fff"/>
          <rect x="38" y="73" width="24" height="5" rx="2.5" fill="#d6f0ed"/>
        </svg>
        <div>
          <h1>Nexus AI Pro</h1>
          <div class="muted" id="tagline">Desktop client</div>
        </div>
      </div>
      <table id="info"></table>
      <div class="foot">© 2026 Nexus AI · MIT License · Built on the certified Nexus AI engine.</div>
    </div>
    <script>
      // Populated from the build info the main process injects on the query string.
      const p = new URLSearchParams(location.search);
      const rows = [
        ["Version", p.get("version")],
        ["Channel", p.get("channel")],
        ["Commit", p.get("commit")],
        ["Build date", p.get("buildDate")],
        ["Electron", p.get("electron")],
        ["Chromium", p.get("chrome")],
        ["Node", p.get("node")],
        ["Engine digest", p.get("engine")],
      ];
      document.getElementById("info").innerHTML = rows
        .filter(([, v]) => v)
        .map(([k, v]) => `<tr><td class="k">${k}</td><td><code>${v}</code></td></tr>`)
        .join("");
    </script>
  </body>
</html>
