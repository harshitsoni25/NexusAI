<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      .card {
        width: 100vw; height: 100vh; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #118a80 0%, #0c5c56 100%);
        color: #fff; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        border-radius: 12px;
      }
      .logo { width: 96px; height: 96px; }
      .title { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
      .sub { font-size: 12px; opacity: .8; }
      .bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 40%; background: #fff; border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-60px);} 50% { transform: translateX(150px);} 100% { transform: translateX(-60px);} }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="92" height="92" rx="22" fill="rgba(255,255,255,0.08)"/>
        <rect x="47.5" y="30" width="5" height="44" rx="2.5" fill="#fff"/>
        <ellipse cx="50" cy="27" rx="8" ry="9" fill="#fff"/>
        <path d="M36 44 Q46 40 50 52 Q40 54 36 44 Z" fill="#d6f0ed"/>
        <path d="M64 40 Q54 38 50 50 Q60 53 64 40 Z" fill="#fff"/>
        <rect x="38" y="73" width="24" height="5" rx="2.5" fill="#d6f0ed"/>
      </svg>
      <div class="title">Nexus AI Pro</div>
      <div class="bar"><i></i></div>
      <div class="sub" id="v">starting…</div>
    </div>
  </body>
</html>
