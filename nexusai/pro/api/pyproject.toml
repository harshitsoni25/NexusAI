[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexusai-pro-api"
version = "0.1.0"
description = "REST backend for Nexus AI Pro — a presentation adapter over the certified Nexus AI engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "nexusai",                     # the certified engine, reused as an immutable library
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.2", "mypy>=1.10", "ruff>=0.5", "black>=24.4"]

[project.scripts]
nexusai-pro-api = "nexusai_pro_api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["nexusai_pro_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
