[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexusai-pro-enterprise"
version = "0.1.0"
description = "Enterprise layer for Nexus AI Pro — auth, users, roles, projects, teams, API keys, audit logs, workspaces. Cloud-ready. Community edition unchanged."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
dev = ["pytest>=8.2", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.115", "pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["nexusai_pro_enterprise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 160
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]
