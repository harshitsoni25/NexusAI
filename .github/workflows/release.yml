# Nexus AI — desktop release pipeline.
# Place at repository root as .github/workflows/release.yml to enable.
# Triggered on a version tag; on each OS runner it assembles the self-contained runtime
# (Python + backend + Playwright + Chromium), builds and signs the installer, and
# publishes it together with the electron-updater manifests.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pro/desktop/package-lock.json

      # Node drives the runtime bundler; the bundler downloads its own relocatable CPython,
      # so no system Python setup is required for the interpreter itself.
      - name: Build renderer (pro/web)
        working-directory: pro/web
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: pro/desktop
        run: npm ci

      # Assemble resources/python (engine + nexusai_pro_api + uvicorn + playwright) and
      # resources/ms-playwright (Chromium) for THIS runner's OS/arch.
      - name: Bundle self-contained runtime
        working-directory: pro/desktop
        run: npm run bundle

      - name: Build, package, sign and publish
        working-directory: pro/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --publish always

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusai-${{ matrix.os }}
          path: |
            pro/desktop/release/*.exe
            pro/desktop/release/*.dmg
            pro/desktop/release/*.zip
            pro/desktop/release/*.AppImage
            pro/desktop/release/*.deb
            pro/desktop/release/*.rpm
            pro/desktop/release/latest*.yml
          if-no-files-found: ignore
